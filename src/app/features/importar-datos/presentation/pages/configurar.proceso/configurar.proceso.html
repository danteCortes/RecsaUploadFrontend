<div class="bg-white rounded-2xl p-8 shadow-lg border border-rin-line">
  <h2 class="text-3xl mb-2 text-rin-ink">Configurar proceso</h2>
  <p class="text-rin-ink/60 mb-8">Definí los parámetros del proceso de carga</p>

  <div class="bg-rin-paper p-6 rounded-xl border border-rin-line">
    <div class="flex items-center gap-2 mb-6">
      <fa-icon [icon]="faDatabase" class="text-rin-ink" />
      <h3 class="text-lg text-rin-ink">Configuración del proceso</h3>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <!-- País -->
      <div>
        <label for="slc-country" class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70">
          País
        </label>
        <select
          id="slc-country"
          class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
          [(ngModel)]="form().country"
          (ngModelChange)="onCountryChange($event)"
        >
          <option value="">Seleccionar país</option>
          @for (country of countries(); track $index) {
            <option [value]="country.id">{{ country.name }}</option>
          }
        </select>
      </div>

      <!-- Empresa -->
      <div>
        <label for="slc-company" class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70">
          <fa-icon [icon]="faCity" />
          Empresa
        </label>
        <select
          id="slc-company"
          class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
          [(ngModel)]="form().company"
        >
          <option value="">Seleccioná una empresa</option>
          @for (company of companies(); track $index) {
            <option [value]="company.id">{{ company.name }}</option>
          }
        </select>
      </div>

      <!-- Interfaz -->
      <div>
        <label for="slc-layout" class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70">
          <fa-icon [icon]="faDatabase" />
          Nombre de interfaz
        </label>
        <select
          id="slc-layout"
          class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
          [(ngModel)]="form().layout_name"
        >
          <option value="">Seleccioná una interfaz</option>
          @for (layout of layouts(); track $index) {
            <option [value]="layout.id">{{ layout.name }}</option>
          }
        </select>
      </div>

      <!-- Tipo de proceso -->
      <div>
        <label for="slc-process-type" class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70">
          <fa-icon [icon]="faArrowUpFromBracket" />
          Tipo de proceso
        </label>
        <select
          id="slc-process-type"
          class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
          [(ngModel)]="form().process_type"
        >
          <option value="">Seleccioná el tipo de proceso</option>
          <option value="Flujo">Flujo</option>
          <option value="Refresco">Refresco</option>
        </select>
      </div>

      <!-- Responsable -->
      <div>
        <label for="inp-responsible" class="text-sm mb-2 block text-rin-ink/70">Responsable</label>
        <input
          id="inp-responsible"
          type="text"
          placeholder="Nombre del responsable"
          class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
          autocomplete="off"
          [(ngModel)]="form().responsible"
        />
      </div>

      <!-- Nombre de template -->
      <div class="col-span-2">
        <label for="inp-template" class="text-sm mb-2 block text-rin-ink/70">Nombre de template</label>
        <input
          id="inp-template"
          type="text"
          placeholder="Nombre del template para reutilizar"
          class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
          autocomplete="off"
          [(ngModel)]="form().template_name"
        />
      </div>
    </div>

    <!-- Botón Siguiente -->
    <div class="flex justify-end mt-4">
      @if (isFormValid()) {
        <button
          class="px-8 py-2.5 rounded-lg font-medium transition-all flex items-center gap-2 bg-rin-orange text-white hover:bg-rin-orange/90 shadow-md hover:shadow-lg"
          (click)="saveAndContinue()"
        >
          @if (spinSave()) {
            Guardando...
          } @else {
            Siguiente
            <fa-icon [icon]="faAngleRight" />
          }
        </button>
      } @else {
        <button
          disabled
          class="px-8 py-2.5 rounded-lg font-medium flex items-center gap-2 bg-rin-line text-rin-ink/40 cursor-not-allowed"
        >
          Siguiente
          <fa-icon [icon]="faAngleRight" />
        </button>
      }
    </div>
  </div>
</div>
