<div class="bg-white rounded-2xl p-8 shadow-lg shadow-[#1E3A5F]/5">
  <h2 class="text-3xl mb-2 text-[#1E3A5F]">Configurar proceso</h2>
  <p class="text-[#1A1614]/60 mb-8">Definí los parámetros del proceso de carga</p>

  <div
    class="bg-linear-to-br from-[#1E3A5F]/5 to-[#2D9596]/5 p-6 rounded-xl border border-[#1E3A5F]/20"
  >
    <div class="flex items-center gap-2 mb-6">
      <fa-icon [icon]="faDatabase" class="text-[#1E3A5F]" />
      <h3 class="text-lg text-[#1E3A5F]">Configuración del proceso</h3>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <!-- Empresa -->
      <div>
        <label for="slc-company" class="flex items-center gap-2 text-sm mb-2 text-[#1A1614]/70">
          <fa-icon [icon]="faCity" />
          Empresa
        </label>
        <select
          id="slc-company"
          class="w-full px-4 py-2.5 rounded-lg border border-[#E4DDD1] bg-white focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/20 transition-all"
          [(ngModel)]="form().company"
        >
          <option value="">Seleccioná una empresa</option>
          @for (company of companies(); track $index) {
            <option [value]="company.id">{{ company.name }}</option>
          }
        </select>
      </div>

      <!-- Interfaz -->
      <div>
        <label for="slc-layout" class="flex items-center gap-2 text-sm mb-2 text-[#1A1614]/70">
          <fa-icon [icon]="faDatabase" />
          Nombre de interfaz
        </label>
        <select
          id="slc-layout"
          class="w-full px-4 py-2.5 rounded-lg border border-[#E4DDD1] bg-white focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/20 transition-all"
          [(ngModel)]="form().layout_name"
        >
          <option value="">Seleccioná una interfaz</option>
          @for (layout of layouts(); track $index) {
            <option [value]="layout.id">{{ layout.name }}</option>
          }
        </select>
      </div>

      <!-- Tipo de carga -->
      <div>
        <label for="slc-load-type" class="flex items-center gap-2 text-sm mb-2 text-[#1A1614]/70">
          <fa-icon [icon]="faArrowUpFromBracket" />
          Tipo de carga
        </label>
        <select
          id="slc-load-type"
          class="w-full px-4 py-2.5 rounded-lg border border-[#E4DDD1] bg-white focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/20 transition-all"
          [(ngModel)]="form().load_type"
        >
          <option value="">Seleccioná el tipo de carga</option>
          @for (loadType of loadTypes(); track $index) {
            <option [value]="loadType.id">{{ loadType.name }}</option>
          }
        </select>
      </div>

      <!-- Responsable -->
      <div>
        <label for="inp-responsible" class="text-sm mb-2 block text-[#1A1614]/70">
          Responsable
        </label>
        <input
          id="inp-responsible"
          type="text"
          placeholder="Nombre del responsable"
          class="w-full px-4 py-2.5 rounded-lg border border-[#E4DDD1] bg-white focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/20 transition-all"
          autocomplete="off"
          [(ngModel)]="form().responsible"
        />
      </div>

      <!-- Nombre de template -->
      <div class="col-span-2">
        <label for="inp-template" class="text-sm mb-2 block text-[#1A1614]/70">
          Nombre de template
        </label>
        <input
          id="inp-template"
          type="text"
          placeholder="Nombre del template para reutilizar"
          class="w-full px-4 py-2.5 rounded-lg border border-[#E4DDD1] bg-white focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/20 transition-all"
          autocomplete="off"
          [(ngModel)]="form().template_name"
        />
      </div>
    </div>

    <!-- Botón Siguiente -->
    <div class="flex justify-end mt-4">
      @if (isFormValid()) {
        <button
          class="px-8 py-2.5 rounded-lg font-medium transition-all flex items-center gap-2 bg-[#1E3A5F] text-white hover:bg-[#152944] shadow-md hover:shadow-lg"
          (click)="saveAndContinue()"
        >
          @if (spinSave()) {
            Guardando...
          } @else {
            Siguiente
            <fa-icon [icon]="faAngleRight" />
          }
        </button>
      } @else {
        <button
          disabled
          class="px-8 py-2.5 rounded-lg font-medium flex items-center gap-2 bg-[#E4DDD1] text-[#1A1614]/40 cursor-not-allowed"
        >
          Siguiente
          <fa-icon [icon]="faAngleRight" />
        </button>
      }
    </div>
  </div>
</div>
