<div class="bg-white rounded-2xl p-8 shadow-lg border border-rin-line" style="opacity: 1; transform: none">
  <h2 class="text-3xl mb-2 text-rin-ink font-bold">Origen de datos</h2>
  <p class="text-rin-ink/60 mb-8">Configurá de dónde se recibirán los archivos</p>
  <div class="mb-8">
    <h3 class="text-lg mb-4 text-rin-ink font-semibold">Tipo de origen</h3>
    <div class="grid grid-cols-3 gap-4">
      <button
        [ngClass]="{
          'p-5 rounded-xl border-2 transition-all text-left': true,
          'border-rin-line bg-white hover:border-rin-orange/50': originType() !== 'sftp',
          'border-rin-orange bg-rin-orange/5 shadow-md': originType() === 'sftp',
        }"
        style="transform: none"
        (click)="originType.set('sftp')"
      >
        <fa-icon [icon]="faServer" class="w-8 h-8 mb-3 text-rin-ink/40" />
        <p class="font-medium mb-1 text-rin-ink">SFTP</p>
        <p class="text-sm text-rin-ink/60">Conexión segura por protocolo SFTP</p>
      </button>
      <button
        [ngClass]="{
          'p-5 rounded-xl border-2 transition-all text-left': true,
          'border-rin-line bg-white hover:border-rin-orange/50': originType() !== 'email',
          'border-rin-orange bg-rin-orange/5 shadow-md': originType() === 'email',
        }"
        style="transform: none"
        (click)="originType.set('email')"
      >
        <fa-icon [icon]="faEnvelope" class="w-8 h-8 mb-3 text-rin-ink/40" />
        <p class="font-medium mb-1 text-rin-ink">Correo electrónico</p>
        <p class="text-sm text-rin-ink/60">Recibir archivos por correo electrónico</p>
      </button>
      <button
        [ngClass]="{
          'p-5 rounded-xl border-2 transition-all text-left': true,
          'border-rin-line bg-white hover:border-rin-orange/50': originType() !== 'teams',
          'border-rin-orange bg-rin-orange/5 shadow-md': originType() === 'teams',
        }"
        style="transform: none"
        (click)="originType.set('teams')"
      >
        <fa-icon [icon]="faEnvelope" class="w-8 h-8 mb-3 text-rin-ink/40" />
        <p class="font-medium mb-1 text-rin-ink">Microsoft Teams</p>
        <p class="text-sm text-rin-ink/60">Recibir archivos desde Teams para procesamiento automático</p>
      </button>
    </div>
  </div>
  @if (originType() === 'sftp') {
    <app-form-sftp />
  } @else if (originType() === 'email') {
    <app-form-email />
  } @else if (originType() === 'teams') {
    <app-form-teams />
  }
  <div class="flex justify-between">
    <button
      class="px-8 py-3 rounded-xl border-2 border-rin-line text-rin-ink font-medium hover:border-rin-ink hover:bg-rin-paper transition-all flex items-center gap-2"
      routerLink="/cargas/importar/manual/nueva/columnas"
    >
      <fa-icon [icon]="faArrowLeft" class="h-5 w-5" />
      Volver
    </button>
    <button
      disabled
      class="px-8 py-3 rounded-xl bg-rin-ink/20 text-white font-medium shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
    >
      Continuar
      <fa-icon [icon]="faCheck" class="h-5 w-5" />
    </button>
  </div>
</div>
