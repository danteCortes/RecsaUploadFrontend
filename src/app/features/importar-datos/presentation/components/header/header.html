<div class="mb-8 flex items-center gap-1 flex-wrap">
  <!-- Paso 0: Configurar proceso -->
  <div class="flex items-center">
    <div
      class="flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all duration-300 text-sm"
      [ngClass]="setBackgroundColor(0)"
    >
      <fa-icon [icon]="faDiagramProject" />
      <span class="font-medium">Configurar proceso</span>
    </div>
    <div class="w-8 h-0.5 mx-1 transition-colors duration-300 bg-[#E4DDD1]"></div>
  </div>
  <!-- Paso 1: Subir archivos -->
  <div class="flex items-center">
    <div
      class="flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all duration-300 text-sm"
      [ngClass]="setBackgroundColor(1)"
    >
      <fa-icon [icon]="faArrowUpFromBracket" />
      <span class="font-medium">Subir archivos</span>
    </div>
    <div class="w-8 h-0.5 mx-1 transition-colors duration-300 bg-[#E4DDD1]"></div>
  </div>
  <!-- Paso 2: Configurar formato -->
  <div class="flex items-center">
    <div
      class="flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all duration-300 text-sm"
      [ngClass]="setBackgroundColor(2)"
    >
      <fa-icon [icon]="faCog" />
      <span class="font-medium">Configurar formato</span>
    </div>
    <div class="w-8 h-0.5 mx-1 transition-colors duration-300 bg-[#E4DDD1]"></div>
  </div>
  <!-- Paso 3: Revisar columnas -->
  <div class="flex items-center">
    <div
      class="flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all duration-300 text-sm"
      [ngClass]="setBackgroundColor(3)"
    >
      <fa-icon [icon]="faCheckSquare" />
      <span class="font-medium">Revisar columnas</span>
    </div>
    <div class="w-8 h-0.5 mx-1 transition-colors duration-300 bg-[#E4DDD1]"></div>
  </div>
  <!-- Paso 4: Confirmar importación -->
  <div class="flex items-center">
    <div
      class="flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all duration-300 text-sm"
      [ngClass]="setBackgroundColor(4)"
    >
      <fa-icon [icon]="faPaperPlane" />
      <span class="font-medium">Confirmar importación</span>
    </div>
  </div>
</div>
