<div class="mb-8 p-6 rounded-xl bg-rin-paper border border-rin-line" style="opacity: 1; height: auto">
  <h3 class="text-lg mb-4 text-rin-ink font-semibold">Configuración de Microsoft Teams</h3>
  <div class="grid grid-cols-1 gap-4">
    <div>
      <span class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70 font-medium">
        <fa-icon [icon]="faMessage" class="w-4 h-4" />
        Canal de Teams
      </span>
      <input
        type="text"
        class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
        placeholder="Equipo / Canal"
      />
    </div>
    <div>
      <span class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70 font-medium">
        <fa-icon [icon]="faFolder" class="w-4 h-4" />
        Carpeta de archivos
      </span>
      <input
        type="text"
        class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
        placeholder="Documentos/Importaciones"
      />
    </div>
    <div class="p-4 rounded-lg bg-rin-info/10 border border-rin-info/20">
      <p class="text-sm text-rin-ink/70">
        <strong>Nota:</strong>
        El bot monitoreará este canal y procesará automáticamente los archivos compartidos en la carpeta especificada.
      </p>
    </div>
  </div>
</div>
