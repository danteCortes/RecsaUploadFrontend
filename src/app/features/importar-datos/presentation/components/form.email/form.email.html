<div class="mb-8 p-6 rounded-xl bg-rin-paper border border-rin-line" style="opacity: 1; height: auto">
  <h3 class="text-lg mb-4 text-rin-ink font-semibold">Configuración de Correo electrónico</h3>
  <div class="grid grid-cols-1 gap-4">
    <div>
      <span class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70 font-medium">
        <fa-icon [icon]="faEnvelope" />
        Dirección de correo electrónico
      </span>
      <input
        type="email"
        class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
        placeholder="archivos@empresa.com"
      />
    </div>
    <div>
      <span class="flex items-center gap-2 text-sm mb-2 text-rin-ink/70 font-medium">
        <fa-icon [icon]="faFolder" />
        Carpeta / Bandeja
      </span>
      <input
        type="text"
        class="w-full px-4 py-2.5 rounded-lg border border-rin-line bg-white focus:outline-none focus:border-rin-orange focus:ring-2 focus:ring-rin-orange/20 transition-all"
        placeholder="Inbox/Importaciones"
      />
    </div>
    <div class="p-4 rounded-lg bg-rin-info/10 border border-rin-info/20">
      <p class="text-sm text-rin-ink/70">
        <strong>Nota:</strong>
        Los archivos recibidos en esta dirección de correo serán procesados automáticamente por el sistema.
      </p>
    </div>
  </div>
</div>
