<div class="p-8 max-w-5xl">
  <!-- Volver -->
  <a
    routerLink="/empresas"
    class="inline-flex items-center gap-2 text-rin-ink/60 hover:text-rin-ink transition-colors mb-6 text-sm font-medium"
  >
    <fa-icon [icon]="faArrowLeft" class="text-xs" />
    Volver a empresas
  </a>

  <h1 class="text-3xl font-bold text-rin-ink mb-1">Nueva empresa</h1>
  <p class="text-rin-ink/60 mb-8">Completá los datos para crear una nueva empresa</p>

  <!-- Card datos empresa -->
  <div class="bg-white rounded-xl border border-rin-line p-6 mb-6">
    <h2 class="text-sm font-semibold text-rin-ink/50 uppercase tracking-wide mb-4">Nueva empresa</h2>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <input
        type="text"
        placeholder="Ingrese código"
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink placeholder:text-rin-ink/40 focus:outline-none focus:border-rin-orange transition-colors"
      />
      <input
        type="text"
        placeholder="Ingrese nombre"
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink placeholder:text-rin-ink/40 focus:outline-none focus:border-rin-orange transition-colors"
      />
      <input
        type="text"
        placeholder="Responsable"
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink placeholder:text-rin-ink/40 focus:outline-none focus:border-rin-orange transition-colors"
      />
      <select
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
      >
        <option value="" disabled selected>País</option>
        @for (p of paises; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
    </div>
    <input
      type="text"
      placeholder="Ingrese nombre de fantasía"
      class="w-full px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink placeholder:text-rin-ink/40 focus:outline-none focus:border-rin-orange transition-colors mb-4"
    />
    <div class="flex justify-end gap-3">
      <a
        routerLink="/empresas"
        class="px-4 py-2 rounded-lg border border-rin-line text-rin-ink/70 hover:bg-rin-surface transition-colors text-sm font-medium"
      >
        Cancelar
      </a>
      <button
        class="px-4 py-2 rounded-lg bg-rin-orange text-white hover:bg-rin-orange/90 transition-colors text-sm font-medium"
      >
        Guardar
      </button>
    </div>
  </div>

  <!-- Card parámetros -->
  <div class="bg-white rounded-xl border border-rin-line p-6">
    <h2 class="text-sm font-semibold text-rin-ink/50 uppercase tracking-wide mb-4">Parámetros</h2>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <select
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
      >
        @for (o of opcionesProducto; track o) {
          <option [value]="o">{{ o }}</option>
        }
      </select>
      <select
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
      >
        @for (o of opcionesArmory; track o) {
          <option [value]="o">{{ o }}</option>
        }
      </select>
      <select
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
      >
        @for (o of opcionesPaleta; track o) {
          <option [value]="o">{{ o }}</option>
        }
      </select>
      <select
        class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
      >
        @for (o of opcionesHomologaciones; track o) {
          <option [value]="o">{{ o }}</option>
        }
      </select>
    </div>
    <div class="flex justify-end gap-3">
      <a
        routerLink="/empresas"
        class="px-4 py-2 rounded-lg border border-rin-line text-rin-ink/70 hover:bg-rin-surface transition-colors text-sm font-medium"
      >
        Cancelar
      </a>
      <button
        class="px-4 py-2 rounded-lg bg-rin-orange text-white hover:bg-rin-orange/90 transition-colors text-sm font-medium"
      >
        Guardar
      </button>
    </div>
  </div>
</div>
