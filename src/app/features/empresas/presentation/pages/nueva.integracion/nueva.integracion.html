<div class="p-8 max-w-5xl">
  <!-- Volver -->
  <a
    routerLink="/empresas/interfaces"
    class="inline-flex items-center gap-2 text-rin-ink/60 hover:text-rin-ink transition-colors mb-6 text-sm font-medium"
  >
    <fa-icon [icon]="faArrowLeft" class="text-xs" />
    Volver a integraciones
  </a>

  <h1 class="text-3xl font-bold text-rin-ink mb-1">Nueva integración</h1>
  <p class="text-rin-ink/60 mb-8">Creá una o más integraciones para el sistema</p>

  <!-- Items de integración -->
  @for (item of items(); track item.id) {
    <div class="bg-white rounded-xl border border-rin-line p-6 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-rin-ink/70">Integración {{ item.id }}</h2>
        @if (items().length > 1) {
          <button
            (click)="eliminar(item.id)"
            class="text-rin-ink/40 hover:text-rin-critical transition-colors text-xs flex items-center gap-1"
          >
            <fa-icon [icon]="faTrash" />
          </button>
        }
      </div>
      <div class="grid grid-cols-3 gap-4">
        <input
          type="text"
          placeholder="Ej: ASIGNACION"
          class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink placeholder:text-rin-ink/40 focus:outline-none focus:border-rin-orange transition-colors"
        />
        <select
          class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
        >
          <option value="" disabled selected>Seleccionar país</option>
          @for (p of paises; track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
        <select
          class="px-4 py-2.5 rounded-lg border border-rin-line text-sm text-rin-ink/60 focus:outline-none focus:border-rin-orange transition-colors bg-white"
        >
          <option value="" disabled selected>Seleccionar empresa</option>
          @for (e of empresas; track e) {
            <option [value]="e">{{ e }}</option>
          }
        </select>
      </div>
    </div>
  }

  <!-- Agregar más -->
  <button
    (click)="agregarMas()"
    class="w-full py-3 rounded-xl border-2 border-dashed border-rin-orange/40 text-rin-orange hover:border-rin-orange hover:bg-rin-orange/5 transition-colors text-sm font-medium mb-8"
  >
    + Agregar más
  </button>

  <!-- Acciones -->
  <div class="flex justify-end gap-3">
    <a
      routerLink="/empresas/interfaces"
      class="px-5 py-2 rounded-lg border border-rin-line text-rin-ink/70 hover:bg-rin-surface transition-colors text-sm font-medium"
    >
      Cancelar
    </a>
    <button
      class="px-5 py-2 rounded-lg bg-rin-orange text-white hover:bg-rin-orange/90 transition-colors text-sm font-medium"
    >
      Guardar
    </button>
  </div>
</div>
