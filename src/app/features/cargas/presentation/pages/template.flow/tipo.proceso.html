<div class="space-y-6">
  <!-- Template config card -->
  @if (config()) {
    <div class="bg-white rounded-2xl p-6 shadow-lg border border-rin-line">
      <h3 class="text-sm font-medium text-rin-ink/50 uppercase tracking-wider mb-4">
        Configuración de template
      </h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-rin-orange/10 flex items-center justify-center">
            <fa-icon [icon]="faTag" class="text-rin-orange text-xs" />
          </div>
          <div>
            <p class="text-xs text-rin-ink/40">Template</p>
            <p class="text-sm font-medium text-rin-ink">{{ config()!.templateName }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-rin-orange/10 flex items-center justify-center">
            <fa-icon [icon]="faBuilding" class="text-rin-orange text-xs" />
          </div>
          <div>
            <p class="text-xs text-rin-ink/40">Empresa</p>
            <p class="text-sm font-medium text-rin-ink">{{ config()!.empresa }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-rin-orange/10 flex items-center justify-center">
            <fa-icon [icon]="faLayerGroup" class="text-rin-orange text-xs" />
          </div>
          <div>
            <p class="text-xs text-rin-ink/40">Interfaz</p>
            <p class="text-sm font-medium text-rin-ink">{{ config()!.interfaz }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-rin-orange/10 flex items-center justify-center">
            <fa-icon [icon]="faTruckLoading" class="text-rin-orange text-xs" />
          </div>
          <div>
            <p class="text-xs text-rin-ink/40">Tipo de carga</p>
            <p class="text-sm font-medium text-rin-ink">{{ config()!.tipoCarga }}</p>
          </div>
        </div>
      </div>
    </div>
  }

  <!-- Process type selection -->
  <div class="bg-white rounded-2xl p-8 shadow-lg border border-rin-line">
    <h2 class="text-3xl mb-2 text-rin-ink">Tipo de proceso</h2>
    <p class="text-rin-ink/60 mb-8">Elegí si es un flujo inicial o un refresco de datos</p>

    <div class="grid grid-cols-2 gap-4 mb-8">
      <!-- Flujo card -->
      <button
        (click)="selectType('Flujo')"
        class="relative p-6 rounded-2xl border-2 transition-all duration-200 text-left cursor-pointer"
        [class.border-rin-ink]="selectedType() === 'Flujo'"
        [class.bg-rin-ink/5]="selectedType() === 'Flujo'"
        [class.border-rin-line]="selectedType() !== 'Flujo'"
        [class.bg-rin-paper]="selectedType() !== 'Flujo'"
      >
        @if (selectedType() === 'Flujo') {
          <div class="absolute top-4 right-4 w-5 h-5 rounded-full bg-rin-ink flex items-center justify-center">
            <fa-icon [icon]="faCheck" class="text-white text-xs" />
          </div>
        }
        <div class="w-14 h-14 rounded-xl bg-rin-ink flex items-center justify-center mb-4 shadow-md">
          <fa-icon [icon]="faDiagramProject" class="text-white text-xl" />
        </div>
        <h3 class="text-xl font-semibold text-rin-ink mb-1">Flujo</h3>
        <p class="text-sm text-rin-ink/50">Carga inicial de datos</p>
      </button>

      <!-- Refresco card -->
      <button
        (click)="selectType('Refresco')"
        class="relative p-6 rounded-2xl border-2 transition-all duration-200 text-left cursor-pointer"
        [class.border-rin-orange]="selectedType() === 'Refresco'"
        [class.bg-rin-orange/5]="selectedType() === 'Refresco'"
        [class.border-rin-line]="selectedType() !== 'Refresco'"
        [class.bg-rin-paper]="selectedType() !== 'Refresco'"
      >
        @if (selectedType() === 'Refresco') {
          <div class="absolute top-4 right-4 w-5 h-5 rounded-full bg-rin-orange flex items-center justify-center">
            <fa-icon [icon]="faCheck" class="text-white text-xs" />
          </div>
        }
        <div class="w-14 h-14 rounded-xl bg-rin-orange flex items-center justify-center mb-4 shadow-md">
          <fa-icon [icon]="faDiagramProject" class="text-white text-xl" />
        </div>
        <h3 class="text-xl font-semibold text-rin-orange mb-1">Refresco</h3>
        <p class="text-sm text-rin-ink/50">Actualización de datos existentes</p>
      </button>
    </div>

    <div class="flex justify-between">
      <button
        routerLink="/cargas/importar/manual/template"
        class="px-8 py-3 rounded-xl border-2 border-rin-line text-rin-ink font-medium hover:border-rin-ink hover:bg-rin-paper transition-all flex items-center gap-2"
      >
        &lsaquo; Volver
      </button>
      <button
        (click)="siguiente()"
        [disabled]="!isFormValid()"
        class="px-8 py-3 rounded-xl bg-rin-orange text-white font-medium shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center gap-2"
      >
        Siguiente
        <fa-icon [icon]="faCheck" />
      </button>
    </div>
  </div>
</div>
