<div class="space-y-6">
  <!-- Template config card -->
  @if (config()) {
    <div class="bg-white rounded-2xl p-6 shadow-lg shadow-[#1E3A5F]/5 border border-[#E4DDD1]">
      <h3 class="text-sm font-medium text-[#1A1614]/50 uppercase tracking-wider mb-4">
        Configuración de template
      </h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-[#2D9596]/10 flex items-center justify-center">
            <fa-icon [icon]="faTag" class="text-[#2D9596] text-xs" />
          </div>
          <div>
            <p class="text-xs text-[#1A1614]/40">Template</p>
            <p class="text-sm font-medium text-[#1E3A5F]">{{ config()!.templateName }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-[#2D9596]/10 flex items-center justify-center">
            <fa-icon [icon]="faBuilding" class="text-[#2D9596] text-xs" />
          </div>
          <div>
            <p class="text-xs text-[#1A1614]/40">Empresa</p>
            <p class="text-sm font-medium text-[#1E3A5F]">{{ config()!.empresa }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-[#2D9596]/10 flex items-center justify-center">
            <fa-icon [icon]="faLayerGroup" class="text-[#2D9596] text-xs" />
          </div>
          <div>
            <p class="text-xs text-[#1A1614]/40">Interfaz</p>
            <p class="text-sm font-medium text-[#1E3A5F]">{{ config()!.interfaz }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-[#2D9596]/10 flex items-center justify-center">
            <fa-icon [icon]="faTruckLoading" class="text-[#2D9596] text-xs" />
          </div>
          <div>
            <p class="text-xs text-[#1A1614]/40">Tipo de carga</p>
            <p class="text-sm font-medium text-[#1E3A5F]">{{ config()!.tipoCarga }}</p>
          </div>
        </div>
      </div>
    </div>
  }

  <!-- Process type selection -->
  <div class="bg-white rounded-2xl p-8 shadow-lg shadow-[#1E3A5F]/5">
    <h2 class="text-3xl mb-2 text-[#1E3A5F]">Tipo de proceso</h2>
    <p class="text-[#1A1614]/60 mb-8">Elegí si es un flujo inicial o un refresco de datos</p>

    <div class="grid grid-cols-2 gap-4 mb-8">
      <!-- Flujo card -->
      <button
        (click)="selectType('Flujo')"
        class="relative p-6 rounded-2xl border-2 transition-all duration-200 text-left cursor-pointer"
        [class.border-[#1E3A5F]]="selectedType() === 'Flujo'"
        [class.bg-[#1E3A5F]/5]="selectedType() === 'Flujo'"
        [class.border-[#E4DDD1]]="selectedType() !== 'Flujo'"
        [class.bg-[#FAF8F5]]="selectedType() !== 'Flujo'"
        [class.hover:border-[#1E3A5F]/50]="selectedType() !== 'Flujo'"
      >
        @if (selectedType() === 'Flujo') {
          <div
            class="absolute top-4 right-4 w-5 h-5 rounded-full bg-[#1E3A5F] flex items-center justify-center"
          >
            <fa-icon [icon]="faCheck" class="text-white text-xs" />
          </div>
        }
        <div
          class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#1E3A5F] to-[#2D9596] flex items-center justify-center mb-4 shadow-md"
        >
          <fa-icon [icon]="faDiagramProject" class="text-white text-xl" />
        </div>
        <h3 class="text-xl font-semibold text-[#1E3A5F] mb-1">Flujo</h3>
        <p class="text-sm text-[#1A1614]/50">Carga inicial de datos</p>
      </button>

      <!-- Refresco card -->
      <button
        (click)="selectType('Refresco')"
        class="relative p-6 rounded-2xl border-2 transition-all duration-200 text-left cursor-pointer"
        [class.border-[#E8A838]]="selectedType() === 'Refresco'"
        [class.bg-[#E8A838]/8]="selectedType() === 'Refresco'"
        [class.border-[#E4DDD1]]="selectedType() !== 'Refresco'"
        [class.bg-[#FAF8F5]]="selectedType() !== 'Refresco'"
        [class.hover:border-[#E8A838]/50]="selectedType() !== 'Refresco'"
      >
        @if (selectedType() === 'Refresco') {
          <div
            class="absolute top-4 right-4 w-5 h-5 rounded-full bg-[#E8A838] flex items-center justify-center"
          >
            <fa-icon [icon]="faCheck" class="text-white text-xs" />
          </div>
        }
        <div
          class="w-14 h-14 rounded-xl bg-gradient-to-br from-[#E8A838] to-[#D97706] flex items-center justify-center mb-4 shadow-md"
        >
          <fa-icon [icon]="faDiagramProject" class="text-white text-xl" />
        </div>
        <h3 class="text-xl font-semibold text-[#E8A838] mb-1">Refresco</h3>
        <p class="text-sm text-[#1A1614]/50">Actualización de datos existentes</p>
      </button>
    </div>

    <div class="flex justify-between">
      <button
        routerLink="/cargas/importar/manual/template"
        class="px-8 py-3 rounded-xl border-2 border-[#E4DDD1] text-[#1A1614] font-medium hover:border-[#1E3A5F] hover:bg-[#FAF8F5] transition-all flex items-center gap-2"
      >
        &lsaquo; Volver
      </button>
      <button
        (click)="siguiente()"
        [disabled]="!isFormValid()"
        class="px-8 py-3 rounded-xl bg-gradient-to-r from-[#1E3A5F] to-[#2D9596] text-white font-medium shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center gap-2"
      >
        Siguiente
        <fa-icon [icon]="faCheck" />
      </button>
    </div>
  </div>
</div>
